name: Map Studio (GitHub Pages test build)

on:
  push:
    branches: [main]
    paths: ['apps/studio/**', '.github/workflows/studio-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci
      - run: npx vitest run
      # Skate 3 export runs ArenaBuilder/DlcBuilder (Dumbad's Skate 3 Modding Tools, no license
      # yet) as .NET WebAssembly. It is only built and hosted once the repo variable
      # STUDIO_SKATE3 is "true", which we set after the author OKs hosting it.
      - uses: actions/setup-dotnet@v4
        if: vars.STUDIO_SKATE3 == 'true'
        with:
          dotnet-version: 9.0.x
      - name: Build Skate 3 WebAssembly tools
        if: vars.STUDIO_SKATE3 == 'true'
        run: |
          dotnet workload install wasm-tools
          bash ../../converter/fetch_tools.sh "$GITHUB_WORKSPACE/work/tools"
          DOTNET_ROOT="$(dirname "$(which dotnet)")" bash dotnet/build.sh
      - run: npm run build
        env:
          STUDIO_BASE: /skatemods/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/studio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
