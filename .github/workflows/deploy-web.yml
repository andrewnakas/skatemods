# Build apps/web and deploy it to Cloudflare Pages (project: skatemods).
# Needs repo secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
# Without them the build still runs, so PRs are checked; only the deploy is skipped.
name: deploy-web

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/deploy-web.yml']
  pull_request:
    paths: ['apps/web/**']
  schedule:
    - cron: '17 */6 * * *' # every 6 hours: new ReSkate mod pages, Discord counts, recomp releases, map catalog
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets can't appear in `if:` directly; expose whether the deploy token exists.
      CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Refresh map catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run sync:catalog
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy
        if: github.event_name != 'pull_request' && env.CF_TOKEN_SET == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name skatemods --branch main --commit-hash ${{ github.sha }}
      - name: Ping IndexNow (Bing and friends)
        if: github.event_name != 'pull_request' && env.CF_TOKEN_SET == 'true'
        run: node scripts/indexnow.mjs || true
